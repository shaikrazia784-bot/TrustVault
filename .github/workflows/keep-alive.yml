
name: Keep TrustVault Awake

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Check TrustVault Health
        run: |
          echo "Checking TrustVault health..."

          curl --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            https://trustvault-df6q.onrender.com/health

          echo "TrustVault health check completed successfully!"
